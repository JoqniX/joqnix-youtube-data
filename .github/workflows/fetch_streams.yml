name: Fetch YouTube Data

on:
  schedule:
    - cron: '0 0 * * 1'
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Create data folders
        run: |
          mkdir -p data
          mkdir -p data/playlists

      - name: Fetch stream IDs
        run: bash scripts/fetch_streams.sh

      - name: Fetch playlist map
        run: bash scripts/fetch_playlists.sh

      - name: Commit data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data
          git commit -m "Update youtube data" || echo "No changes"
          git push
