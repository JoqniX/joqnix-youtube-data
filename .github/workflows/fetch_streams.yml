name: Fetch YouTube Streams

on:
  schedule:
    - cron: '0 */2 * * *'
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Ensure data folder exists
        run: mkdir -p data

      - name: Run stream fetch script
        run: bash scripts/fetch_streams.sh

      - name: Commit updated streams.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/streams.json
          git commit -m "Update streams list" || echo "No changes"
          git push
