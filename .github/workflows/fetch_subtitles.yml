name: Fetch YouTube Subtitles

on:
  schedule:
    - cron: '0 1 * * 3'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install NodeJS (needed for yt-dlp)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Create subtitles folder
        run: mkdir -p subtitles

      - name: Run subtitle script
        run: bash scripts/fetch_subtitles.sh

      - name: Commit subtitles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add subtitles
          git commit -m "Add subtitles" || echo "No changes"
          git push
