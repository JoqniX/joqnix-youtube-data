name: Fetch YouTube Subtitles

on:
  schedule:
    - cron: '0 1 * * 3'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write cookies file
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install yt-dlp nightly
        run: pip install -U yt-dlp-nightly

      - name: Debug subtitle availability
        run: |
          yt-dlp \
            --cookies cookies.txt \
            --list-subs \
            https://www.youtube.com/watch?v=$(jq -r '.[0]' data/streams.json)

      - name: Create subtitles folder
        run: mkdir -p subtitles

      - name: Run subtitle script
        run: bash scripts/fetch_subtitles.sh

      - name: Commit subtitles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add subtitles
          git commit -m "Add subtitles" || echo "No changes"
          git push
