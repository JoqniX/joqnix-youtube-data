name: Fetch Thumbnails

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  fetch-thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write cookies file
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install "yt-dlp[default]"

      - name: Install Pillow
        run: pip install pillow

      - name: Run thumbnail script
        run: python scripts/fetch_thumbnails.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add thumbnails
          git commit -m "Update thumbnails" || echo "No changes"
          git push
