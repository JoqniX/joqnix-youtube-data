name: Fetch Thumbnails

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch YouTube cookies from Cloudflare
        env:
          COOKIE_SYNC_TOKEN: ${{ secrets.COOKIE_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${COOKIE_SYNC_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.joqnix.space/cookies/youtube.com" \
            -o cookie-response.json

          jq -e '.success == true and (.netscape | type == "string") and (.netscape | length > 0)' \
            cookie-response.json > /dev/null

          umask 077
          jq -r '.netscape' cookie-response.json > cookies.txt
          rm -f cookie-response.json

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install yt-dlp with curl-cffi
        run: pip install "yt-dlp[default,curl-cffi]" requests
        
      - name: Run thumbnail script
        run: python scripts/fetch_thumbnails.py

      - name: Commit thumbnails
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          rm -f cookies.txt

          git add thumbnails
          git commit -m "Update thumbnails" || echo "No changes"
          git pull --rebase origin Main-dayo
          git push origin Main-dayo
