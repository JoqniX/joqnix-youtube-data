name: Generate AI Metadata

on:
  workflow_dispatch:
  push:
    paths:
      - "subtitles/**.json"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run AI generator
        run: |
          python scripts/generate_ai.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add ai/
          git commit -m "Generate AI metadata" || echo "No changes"
          git push
